<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fractal — experiment</title>
<link rel="stylesheet" href="./lab.css" />
<style>
  /* Dark plate: the escape-time interior is near-black, so invert the copy. */
  body { background: #0b0b0d; }
  :root {
    --bg-strength: 0.52;
    --ink: #f5f5f4;
    --ink-soft: rgba(245, 245, 244, 0.72);
    --hud: rgba(245, 245, 244, 0.5);
    --hud-strong: rgba(245, 245, 244, 0.86);
    --veil-core: rgba(11, 11, 13, 0.92);
    --veil-mid: rgba(11, 11, 13, 0.55);
  }
  .fallback {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #f5f5f4; font-family: var(--font-mono); font-size: 0.8rem;
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="veil"></div>

<main class="overlay">
  <h1>Emaan Heidari</h1>
  <p class="tagline">
    Computer engineering + CS at USC. I build <em>high-throughput,
    low-latency</em> systems software.
  </p>
  <nav>
    <a href="/">home</a>
    <a href="/projects.html">projects</a>
    <a href="/random.html">random</a>
  </nav>
</main>

<div class="hud">
  <span class="hud-name" id="hud-mode">mandelbrot</span>
  <span>×<b id="hud-zoom">1</b></span>
  <span><b id="hud-iter">—</b> iter</span>
  <span class="hud-hint">move to steer · scroll to zoom · click to switch set</span>
  <a class="hud-back" href="./">all experiments</a>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, depth: false })
          || canvas.getContext('experimental-webgl');

  if (!gl) {
    const d = document.createElement('div');
    d.className = 'fallback';
    d.textContent = 'WebGL unavailable — this one needs the GPU.';
    document.body.appendChild(d);
    return;
  }

  const hudMode = document.getElementById('hud-mode');
  const hudZoom = document.getElementById('hud-zoom');
  const hudIter = document.getElementById('hud-iter');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------- shaders */

  const VERT = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;

  const FRAG = `
    precision highp float;

    uniform vec2  uRes;
    uniform vec2  uCenter;
    uniform float uScale;
    uniform vec2  uJulia;
    uniform float uMode;    // 0 = mandelbrot, 1 = julia
    uniform float uIter;
    uniform float uTint;

    // Cosine palette (Iñigo Quílez). Muted, so copy stays readable on top.
    vec3 palette(float t) {
      vec3 a = vec3(0.30, 0.31, 0.35);
      vec3 b = vec3(0.22, 0.21, 0.20);
      vec3 d = vec3(0.00, 0.14, 0.28);
      return a + b * cos(6.28318530718 * (t + d));
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

      vec2 z, c;
      if (uMode < 0.5) {
        c = uCenter + uv * uScale;
        z = vec2(0.0);
      } else {
        c = uJulia;
        z = uCenter + uv * uScale;
      }

      float i = 0.0;
      bool escaped = false;

      for (int k = 0; k < 600; k++) {
        if (float(k) >= uIter) break;
        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
        if (dot(z, z) > 2048.0) { escaped = true; break; }
        i += 1.0;
      }

      if (!escaped) {
        gl_FragColor = vec4(0.043, 0.043, 0.051, 1.0);
        return;
      }

      // Continuous (fractional) escape count removes the iteration banding.
      float sn = i + 1.0 - log(log(length(z)) / log(2.0)) / log(2.0);
      float t  = pow(clamp(sn / uIter, 0.0, 1.0), 0.42);

      vec3 col = palette(t + uTint);
      col *= smoothstep(0.0, 0.06, t);        // ease the interior edge
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  // One oversized triangle covers the viewport with no index buffer.
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {
    res:    gl.getUniformLocation(prog, 'uRes'),
    center: gl.getUniformLocation(prog, 'uCenter'),
    scale:  gl.getUniformLocation(prog, 'uScale'),
    julia:  gl.getUniformLocation(prog, 'uJulia'),
    mode:   gl.getUniformLocation(prog, 'uMode'),
    iter:   gl.getUniformLocation(prog, 'uIter'),
    tint:   gl.getUniformLocation(prog, 'uTint'),
  };

  /* --------------------------------------------------------------- state */

  // float32 in the shader runs out of mantissa around here; past it the
  // image turns to blocks, so the zoom breathes back out instead.
  const MIN_SCALE = 7e-6;
  const MAX_SCALE = 2.6;

  // A seahorse-valley seed: dense structure at every depth on the way in.
  const HOME = [-0.743643887037151, 0.131825904205330];

  const st = {
    cx: HOME[0], cy: HOME[1],
    tx: HOME[0], ty: HOME[1],
    scale: MAX_SCALE,
    dir: -1,                 // -1 zooming in, +1 backing out
    mode: 0,
    jx: -0.4, jy: 0.6,
    tint: 0,
    manualUntil: 0,
  };

  const mouse = { x: 0.5, y: 0.5, seen: false };
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  window.addEventListener('resize', resize);
  resize();

  /* --------------------------------------------------------------- input */

  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX / W;
    mouse.y = e.clientY / H;
    mouse.seen = true;

    if (st.mode === 1) {
      // Ride the main cardioid's boundary: every c here is a live Julia set,
      // never a solid disc or scattered dust.
      const th = mouse.x * Math.PI * 2;
      const r  = 0.965 + mouse.y * 0.075;
      st.jx = r * (Math.cos(th) * 0.5 - Math.cos(2 * th) * 0.25);
      st.jy = r * (Math.sin(th) * 0.5 - Math.sin(2 * th) * 0.25);
    } else {
      // Steer the descent: aim at whatever sits under the cursor.
      const ux = (mouse.x - 0.5) * (W / H);
      const uy = (0.5 - mouse.y);
      st.tx = st.cx + ux * st.scale;
      st.ty = st.cy + uy * st.scale;
    }
  }, { passive: true });

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = Math.exp(e.deltaY * 0.0014);
    st.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, st.scale * f));
    st.manualUntil = performance.now() + 2200;
  }, { passive: false });

  window.addEventListener('pointerdown', () => {
    st.mode = st.mode === 0 ? 1 : 0;
    if (st.mode === 1) {
      st.cx = 0; st.cy = 0; st.tx = 0; st.ty = 0;
      st.scale = 1.55;
    } else {
      st.cx = HOME[0]; st.cy = HOME[1];
      st.tx = HOME[0]; st.ty = HOME[1];
      st.scale = MAX_SCALE;
      st.dir = -1;
    }
    hudMode.textContent = st.mode === 0 ? 'mandelbrot' : 'julia';
  });

  /* --------------------------------------------------------------- frame */

  function frame(now) {
    const manual = now < st.manualUntil;

    if (st.mode === 0) {
      if (!manual && !reduced) {
        st.scale *= st.dir < 0 ? 0.9945 : 1.0075;
        if (st.scale <= MIN_SCALE) st.dir = 1;
        if (st.scale >= MAX_SCALE) { st.dir = -1; st.tx = HOME[0]; st.ty = HOME[1]; }
      }
      // Ease toward the steered target; slower when deep, so it never lurches.
      const k = mouse.seen ? 0.022 : 0.006;
      st.cx += (st.tx - st.cx) * k;
      st.cy += (st.ty - st.cy) * k;
    }

    // More depth needs more iterations to keep the filaments from dissolving.
    const iter = Math.min(600, Math.round(95 + 62 * Math.log2(MAX_SCALE / st.scale)));

    st.tint += reduced ? 0 : 0.00012;

    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.uniform2f(U.center, st.cx, st.cy);
    gl.uniform1f(U.scale, st.scale);
    gl.uniform2f(U.julia, st.jx, st.jy);
    gl.uniform1f(U.mode, st.mode);
    gl.uniform1f(U.iter, iter);
    gl.uniform1f(U.tint, st.tint);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const mag = MAX_SCALE / st.scale;
    hudZoom.textContent = mag < 1000
      ? mag.toFixed(mag < 10 ? 1 : 0)
      : mag.toExponential(1).replace('e+', 'e');
    hudIter.textContent = iter;

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
